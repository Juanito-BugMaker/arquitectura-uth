{% load socialaccount %}
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>🎮 NeuroMatch</title>

<style>

body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #020617, #000000);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Orbitron', sans-serif;
    color: white;
    overflow: hidden;
}

/* 🌌 PARTÍCULAS */
#particles {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: 0;
}

/* 🔥 LLAMAS AZULES */
.flames {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 120px;
    background: linear-gradient(to top, rgba(0,255,255,0.3), transparent);
    z-index: 1;
    overflow: hidden;
}

.flames span {
    position: absolute;
    bottom: 0;
    width: 20px;
    height: 60px;
    background: cyan;
    border-radius: 50%;
    filter: blur(8px);
    animation: flame 2s infinite ease-in-out;
}

@keyframes flame {
    0% { transform: translateY(0) scale(1); opacity: 0.7; }
    50% { transform: translateY(-40px) scale(1.5); opacity: 0.3; }
    100% { transform: translateY(0) scale(1); opacity: 0.7; }
}

/* 🎮 CONTENEDOR */
.box {
    position: relative;
    z-index: 3;
    background: rgba(0,0,0,0.85);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 0 50px cyan;
    text-align: center;
    width: 300px;
    animation: fadeIn 1s ease;
}

/* TITULO */
h1 {
    color: cyan;
    text-shadow: 0 0 25px cyan;
}

/* INPUTS */
input {
    display: block;
    margin: 12px auto;
    padding: 12px;
    width: 90%;
    border-radius: 10px;
    border: 1px solid cyan;
    background: #020617;
    color: white;
    outline: none;
    transition: 0.3s;
}

input:focus {
    box-shadow: 0 0 20px cyan;
    transform: scale(1.05);
}

/* BOTÓN */
button {
    padding: 12px;
    width: 95%;
    background: linear-gradient(45deg, cyan, #0ea5e9);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px cyan;
}


/* BOTÓN GOOGLE NEÓN */
.google-btn {
    display: block;
    margin: 15px auto;
    padding: 10px;
    width: 85%;
    background: transparent;
    border: 1px solid #db4437;
    color: white;
    border-radius: 10px;
    font-weight: bold;
    text-decoration: none;
    transition: 0.3s;
}

.google-btn:hover {
    background: #db4437;
    box-shadow: 0 0 20px #db4437;
    transform: scale(1.05);
    text-shadow: none;
}


/* ERROR */
.error {
    color: #ff4d4d;
    margin-bottom: 10px;
}

/* LINK */
a {
    color: cyan;
    text-decoration: none;
}

a:hover {
    text-shadow: 0 0 10px cyan;
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<!-- 🎧 MUSICA -->
<audio id="bgMusic" loop>
    <source src="{% static 'sounds/halo.mp3' %}" type="audio/mp3">
</audio>

<canvas id="particles"></canvas>

<!-- 🔥 LLAMAS -->
<div class="flames">
    <span style="left:10%"></span>
    <span style="left:25%"></span>
    <span style="left:40%"></span>
    <span style="left:55%"></span>
    <span style="left:70%"></span>
    <span style="left:85%"></span>
</div>

<div class="box">

    <h1>🎮 NEUROMATCH</h1>
    <h2>Bienvenido</h2>

    {% if error %}
        <div class="error">⚠ {{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="👤 Usuario" required>
        <input type="password" name="password" placeholder="🔒 Contraseña" required>

        <button type="submit">🚀 Entrar</button>
    </form> <div style="margin: 15px 0;">
        <span style="color: #666; font-size: 12px;">─── O ───</span>
    </div>
    
    <a href="{% provider_login_url 'google' %}" class="google-btn">
        🔴 Entrar con Google
    </a>

    <p>¿No tienes cuenta? <a href="/register/">Registrarse</a></p>

</div>

<script>

// 🎧 ACTIVAR MUSICA
const music = document.getElementById("bgMusic");

document.addEventListener("click", () => {
    if (music.paused) {
        music.volume = 0.3;
        music.play().catch(()=>{});
    }
}, { once: true });


// ✨ PARTICULAS
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 80; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speedX: (Math.random() - 0.5) * 0.5,
        speedY: (Math.random() - 0.5) * 0.5
    });
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
        ctx.fillStyle = "cyan";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
        if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
    });

    requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

</script>

</body>
</html>
