{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro - Memory Game</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    background: radial-gradient(circle at top, #020617, #000000);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: rgba(0,0,0,0.8);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 0 30px cyan;
    text-align: center;
    width: 350px;
}

h1 {
    color: cyan;
    text-shadow: 0 0 10px cyan;
}

input {
    width: 90%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    border: 1px solid cyan;
    background: #020617;
    color: white;
}

input:focus {
    box-shadow: 0 0 10px cyan;
}

button {
    width: 95%;
    padding: 12px;
    margin-top: 15px;
    border-radius: 30px;
    background: linear-gradient(45deg, #00c853, #00ff95);
    border: none;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    box-shadow: 0 0 15px cyan;
}

/* ERROR */
.error {
    color: red;
}

/* LINK */
a {
    color: cyan;
    text-decoration: none;
}

</style>
</head>

<body>

<div class="container">

    <h1>📝 Crear Cuenta</h1>

    <form method="POST" onsubmit="return validar()">
        {% csrf_token %}
        <input type="text" name="username" placeholder="👤 Usuario" required>
        <input type="email" name="email" placeholder="📧 Correo" required>
        <input type="password" id="pass1" name="password" placeholder="🔒 Contraseña" required>
        <input type="password" id="pass2" placeholder="🔒 Confirmar contraseña" required>

        <button type="submit">🚀 Registrarse</button>
    </form>

    {% if error %}
        <p class="error">⚠ {{ error }}</p>
    {% endif %}

    <a href="/">⬅ Volver al Login</a>

</div>

<script>
function validar(){
    const p1 = document.getElementById("pass1").value;
    const p2 = document.getElementById("pass2").value;

    if(p1 !== p2){
        alert("⚠ Las contraseñas no coinciden");
        return false;
    }
    return true;
}
</script>

</body>
</html>
