{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Seleccionar Dificultad</title>

<style>
body {
    background: radial-gradient(circle at top, #020617, #000814);
    color: white;
    text-align: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
}

h1 {
    margin-top: 40px;
    font-size: 42px;
    color: cyan;
    text-shadow: 0 0 20px cyan;
}

.subtitle {
    color: #94a3b8;
    margin-bottom: 40px;
}

.levels-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 25px;
}

.level-card {
    width: 320px;
    padding: 25px;
    border-radius: 18px;
    cursor: pointer;
    transition: 0.3s;
    font-size: 22px;
    font-weight: bold;
}

.level-card:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px cyan;
}

.novato { background: #22c55e; color: black; }
.estratega { background: #f59e0b; color: black; }
.maestro { background: #ef4444; }
.leyenda { background: #7c3aed; animation: glow 2s infinite alternate; }

@keyframes glow {
    from { box-shadow: 0 0 10px #a78bfa; }
    to { box-shadow: 0 0 30px #c084fc; }
}

.emoji {
    font-size: 30px;
    display: block;
    margin-bottom: 10px;
}

.menu-btn {
    margin-top:30px;
    padding:12px 25px;
    background:#0ea5e9;
    border:none;
    border-radius:10px;
    color:white;
    cursor:pointer;
}

/* POPUP */
#prepModal {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal-box {
    background:#020617;
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 30px cyan;
    text-align:center;
}

#prepText {
    font-size:35px;
    color:cyan;
    text-shadow:0 0 20px cyan;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<h1>🎮 Selecciona tu Nivel de Desafío</h1>

<div class="levels-container">

    <div class="level-card novato"
         onmouseover="hoverSound()"
         onclick="clickSound(); startLevel('basic')">
        <span class="emoji">🐣</span>
        Modo Novato
    </div>

    <div class="level-card estratega"
         onmouseover="hoverSound()"
         onclick="clickSound(); startLevel('medium')">
        <span class="emoji">🧠</span>
        Modo Estratega
    </div>

    <div class="level-card maestro"
         onmouseover="hoverSound()"
         onclick="clickSound(); startLevel('hard')">
        <span class="emoji">⚔️</span>
        Modo Maestro
    </div>

    <div class="level-card leyenda"
         onmouseover="hoverSound()"
         onclick="clickSound(); startLevel('extreme')">
        <span class="emoji">💀🔥</span>
        Modo Leyenda
    </div>

</div>

<button class="menu-btn" onclick="clickSound(); window.location.href='/menu/'">
⬅ Volver al Menú
</button>

<!-- 🔥 SONIDOS CORREGIDOS -->
<audio id="hoverAudio" src="{% static 'sounds/hover.mp3' %}"></audio>
<audio id="clickAudio" src="{% static 'sounds/click.mp3' %}"></audio>

<!-- POPUP -->
<div id="prepModal">
    <div class="modal-box">
        <h2 id="prepText">Preparando...</h2>
    </div>
</div>

<script>

// 🔊 SONIDOS
function hoverSound() {
    const audio = document.getElementById("hoverAudio");
    audio.currentTime = 0;
    audio.volume = 0.3;
    audio.play().catch(()=>{});
}

function clickSound() {
    const audio = document.getElementById("clickAudio");
    audio.currentTime = 0;
    audio.volume = 0.6;
    audio.play().catch(()=>{});
}

// 🚀 INICIO NIVEL
function startLevel(level) {

    let intentos = 0;

    if (level === "basic") intentos = 12;
    if (level === "medium") intentos = 10;
    if (level === "hard") intentos = 8;
    if (level === "extreme") intentos = 5;

    const modal = document.getElementById("prepModal");
    const text = document.getElementById("prepText");

    modal.style.display = "flex";

    text.innerText = "🧠 Preparando sistema...";

    setTimeout(() => {
        text.innerText = "⚡ Cargando memoria...";
    }, 700);

    setTimeout(() => {
        text.innerText = "🎯 Tienes " + intentos + " intentos";
    }, 1400);

    setTimeout(() => {
        text.innerText = "3";
    }, 2200);

    setTimeout(() => {
        text.innerText = "2";
    }, 2700);

    setTimeout(() => {
        text.innerText = "1";
    }, 3200);

    setTimeout(() => {
        text.innerText = "🚀 INICIANDO...";
    }, 3700);

    setTimeout(() => {
        window.location.href = "/game/?level=" + level;
    }, 4000);
}

</script>

</body>
</html>
